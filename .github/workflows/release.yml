# ============================================================================
#  release.yml —— 三平台自动构建 + 打包
# ----------------------------------------------------------------------------
#  产出七个包：
#    1. win64.zip                      Qt 6.8   （windows-2022）
#    2. x86_64.AppImage                Qt 5.15.2（容器 ubuntu:18.04）→ glibc 2.17+
#    3. glibc228-x86_64.AppImage       Qt 6.8   （容器 rockylinux:8）→ glibc 2.28+
#    4. amd64.deb                      ubuntu:24.04 系统 Qt6（依赖系统 Qt）
#    5. x86_64.rpm                     fedora:43 系统 Qt6   （依赖系统 Qt）
#    6. macos-x86_64.zip               Qt 5.15.2（macos-15-intel 原生）
#    7. macos-arm64.zip                Qt 6.8   （macos-14 原生）
#
#  触发：推送 v*.*.* 标签，或手动 workflow_dispatch。
#
#  ★ 为什么 Qt 版本在各 job 里不同 ★
#      · AppImage 要低 glibc → Qt 二进制自身基线要低 → Qt5(2.17) / Qt6(2.28)
#        Qt 官方 Linux 二进制是按最低发行版编的，实测归档标签：
#          Qt 5.15.2 → qtbase-Linux-RHEL_7_6-GCC-...  （RHEL 7.6 = glibc 2.17）
#          Qt 6.8.1  → qtbase-Linux-RHEL_8_10-GCC-... （RHEL 8.10 = glibc 2.28）
#        ⇒ 因此 Qt6 的 AppImage 必须在一个 glibc≈2.28 的容器里编译，
#          否则编译产物自身会带上更高版本的 GLIBC_2.x 符号，AppImage 就白搭了。
#      · deb/rpm 要"依赖系统 Qt" → 必须用**目标发行版自带的** Qt 编译
#        （Qt 只保证同大版本内向后二进制兼容，用新 Qt 编的跑不了旧系统）
#      · macOS x86_64 用 Qt5 能把最低版本压到 10.13；arm64 用 Qt6（下限 11.0，
#        而 Apple Silicon 出厂就是 11+）
#
#  ★ 版本号 ★
#    统一取下面 env 里的 APP_VERSION，与 CMakeLists / main.cpp 三处保持一致。
# ============================================================================

name: Build & Package

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

# 同一分支的重复触发互相取消，省 CI 时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: '1.0.2'          # ← 版本号唯一来源（以后可换成 ${{ github.ref_name }}）

jobs:
  # ────────────────────────────────────────────────────────────────────────
  #  1. Windows —— Qt 6.8 + windeployqt + ZIP
  # ────────────────────────────────────────────────────────────────────────
  windows:
    name: Windows (Qt 6.8, ZIP)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: 配置
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_BUILD_TYPE=Release -DZLPE_REQUIRE_I18N=ON

      - name: 构建
        run: cmake --build build --config Release

      - name: 收集 DLL（windeployqt）
        shell: pwsh
        run: |
          $exe = "build\bin\Release\ZlPhotoEdit.exe"
          if (!(Test-Path $exe)) { $exe = "build\bin\ZlPhotoEdit.exe" }
          if (!(Test-Path $exe)) { throw "找不到 ZlPhotoEdit.exe" }
          $dist = "dist\ZlPhotoEdit-win64"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item $exe $dist
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw "$dist\ZlPhotoEdit.exe"
          Compress-Archive -Path "$dist\*" -DestinationPath "dist\ZlPhotoEdit-$env:APP_VERSION-win64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: win64
          path: dist/*.zip
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────
  #  2. Linux AppImage（Qt 5）—— 低 glibc 2.17
  #
  #     ★ 为什么"宿主下 Qt、容器只编译" ★
  #       在 18.04 容器里装 aqtinstall 会死在 python3.6 编 psutil：
  #         UnicodeDecodeError: 'ascii' codec can't decode byte 0xc5
  #       （bionic 已归档，但 pip 仍能拉到包 —— 问题是老 Python 编不动）
  #       ⇒ 改成在**宿主 runner**用 install-qt-action 把 Qt 下好，
  #         只把 Qt 目录挂载进容器。容器只干"用低 glibc 编译"这一件事。
  #
  #     ★ 为什么 checkout 也在容器外 ★
  #       GitHub 把 checkout@v3/v4 都强制跑在 Node24 上，而 Node24 要求
  #       glibc >= 2.28 —— 18.04 是 2.27，容器里任何 action 都跑不起来。
  #
  #     ★ 为什么要装 Kitware 源 ★
  #       项目 CMakeLists 要求 cmake >= 3.16，而 bionic 自带 3.10.2。
  # ────────────────────────────────────────────────────────────────────────
  appimage-qt5:
    name: Linux AppImage (Qt 5.15.2, glibc 2.17+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 在宿主上下载 Qt 5.15.2（避开 18.04 的老 Python）
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'gcc_64'
          cache: true

      - name: 在 ubuntu:18.04 容器里编译 + 打包
        run: |
          docker run --rm \
            -v "$PWD":/work -w /work \
            -v "$QT_ROOT_DIR":/opt/Qt:ro \
            -e APP_VERSION="${{ env.APP_VERSION }}" \
            ubuntu:18.04 \
            bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential ninja-build file wget ca-certificates \
                software-properties-common gnupg python3 \
                libgl1-mesa-dev libglu1-mesa-dev \
                libx11-dev libxext-dev libxrender-dev libxfixes-dev libxi-dev \
                libxkbcommon-dev libxkbcommon-x11-dev \
                libxcb1-dev libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev \
                libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev \
                libxcb-shape0-dev libxcb-shm0-dev libxcb-sync-dev \
                libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-util-dev \
                libxcb-xkb-dev libfontconfig1-dev libfreetype6-dev \
                libcups2-dev

              # bionic 自带 cmake 3.10.2，项目要求 >= 3.16 → 加 Kitware 源
              wget -qO - https://apt.kitware.com/keys/kitware-archive-latest.asc \
                | apt-key add - 2>/dev/null
              apt-add-repository -y "deb https://apt.kitware.com/ubuntu/ bionic main"
              apt-get update
              apt-get install -y --no-install-recommends cmake
              cmake --version

              cmake -S . -B build-qt5 -G Ninja -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_PREFIX_PATH=/opt/Qt -DZLPE_REQUIRE_I18N=ON
              cmake --build build-qt5

              export APPIMAGE_EXTRACT_AND_RUN=1
              export QTDIR=/opt/Qt
              export PATH="$QTDIR/bin:$PATH"
              export VERSION="$APP_VERSION"
              export OUTPUT="ZlPhotoEdit-${APP_VERSION}-x86_64.AppImage"

              wget -q -O linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
              wget -q -O linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
              chmod +x linuxdeploy linuxdeploy-plugin-qt

              mkdir -p AppDir/usr/bin AppDir/usr/share/applications \
                       AppDir/usr/share/icons/hicolor/256x256/apps
              cp build-qt5/ZlPhotoEdit                    AppDir/usr/bin/
              cp packaging/linux/zlphotoedit.desktop      AppDir/usr/share/applications/
              cp packaging/linux/zlphotoedit.png          AppDir/usr/share/icons/hicolor/256x256/apps/

              # ★★ 两个都要设：命令行参数 + 环境变量 ★★
              #
              # 第 10 轮实测发现：只给 linuxdeploy 传 --exclude-library **不生效** ——
              # 产物里 libsystemd.so.0 / libbsd.so.0 依然被打包（实测仍为 2.27）。
              #   原因：--exclude-library 只进 linuxdeploy 自己那份 AppDir 状态；
              #   而真正去收集 Qt 依赖的是 **qt 插件（独立子进程）**，它自己 new 一个
              #      AppDir，只认自己收到的 --exclude-library。
              #   而 AppDir 构造函数还会读 **环境变量** LINUXDEPLOY_EXCLUDED_LIBRARIES
              #      （源码 src/core/appdir.cpp 里是 splitEnv("LINUXDEPLOY_EXCLUDED_LIBRARIES", 分号)），
              #   子进程天然继承环境 ⇒ 环境变量这条才能穿透到插件。
              #   ⇒ 命令行 + 环境变量**双写**，两条路径都排除。
              #
              # ★ 为什么必须排除这两个（"低 glibc"能不能兑现的关键）★
              #   实测（解包 AppImage 后逐 ELF 扫 GLIBC_2.x 字符串）：
              #     不排除时整个 AppImage 的最高需求 = GLIBC_2.27，只有两个文件超标：
              #       usr/lib/libsystemd.so.0  → 2.27
              #       usr/lib/libbsd.so.0      → 2.25
              #   依赖链（实测 DT_NEEDED）：
              #     libqxcb.so → libQt5DBus → libdbus-1 → libsystemd.so.0
              #     libXdmcp.so.6 → libbsd.so.0
              #   这两个库在所有现代发行版里都由**系统**提供，本该由宿主提供；
              #   从 18.04 容器拖出去只会把 glibc 下限抬到 2.27，与目标相悖。
              # ⇒ 排除后最高需求应回落到 GLIBC_2.17（Qt 5.15.2 二进制自身的基线）。
              #
              # 为什么 libcups 链要"装进来再排除"（缺一不可，第 16、17 轮实测）：
              #   本工程加了打印/导出 PDF 后，Qt5 PrintSupport 的
              #   libcupsprintersupport.so 链 libcups.so.2。linuxdeploy 对每个
              #   DT_NEEDED 的处理顺序是：先按名字找库，找不到就直接
              #   ERROR Could not find dependency 退出；找到才查排除名单。
              #   libsystemd/libbsd 当初能排除成功，正因为 18.04 自带它们。
              #   ⇒ 必须先在容器里装 libcups2-dev（仅构建期），排除名单才有机会生效。
              #   第 17 轮的新发现：排除 libcups 只是让它自己不打包，插件的**其它**
              #   直接依赖照样部署 —— libcupsprintersupport.so 还直接链
              #   libgnutls.so.30（Kerberos/GSSAPI 与 p11-kit 是它的传递依赖），
              #   这三个在 18.04 上分别是 2.25/2.26/2.27 基线，把 AppImage 抬过 2.17。
              #   ⇒ 整条链四个库全部排除；它们只服务于 CUPS 打印，排除后插件加载
              #   失败、Qt 静默降级，导出 PDF 不依赖 CUPS 仍可用。
              #   代价：这个包里打印到实体打印机不可用，其它包（win/mac/deb/rpm/Qt6）
              #   不受影响（Qt6 那个 job 在 rockylinux:8，系统自带 libcups）。
              export LINUXDEPLOY_EXCLUDED_LIBRARIES="libsystemd.so.0;libbsd.so.0;libcups.so.2;libgnutls.so.30;libp11-kit.so.0;libgssapi_krb5.so.2"
              ./linuxdeploy --appdir AppDir --plugin qt --output appimage \
                --exclude-library "libsystemd.so.0" \
                --exclude-library "libbsd.so.0" \
                --exclude-library "libcups.so.2" \
                --exclude-library "libgnutls.so.30" \
                --exclude-library "libp11-kit.so.0" \
                --exclude-library "libgssapi_krb5.so.2"

              # ★★ 自证：把 glibc 上限做成构建期断言，而不是"希望它是 2.17" ★★
              #   那个 python 文件是**仓内真脚本**（不是塞在 YAML 里的多行代码）——
              #   YAML 里嵌多行 python 极易踩缩进坑，且本地也能单独跑。
              #   AppImage 自带 --appimage-extract；上面已设 APPIMAGE_EXTRACT_AND_RUN=1，
              #   所以无 FUSE 的容器里也能解包。
              ./ZlPhotoEdit-*.AppImage --appimage-extract >/dev/null
              # PYTHONIOENCODING：容器是 POSIX locale，Python 3.6 的 stdout 编码是
              # ASCII，脚本里的中文输出会 UnicodeEncodeError（第 12 轮就是这么挂的）。
              # 脚本自身也有编码兜底，这里是双保险。
              PYTHONIOENCODING=utf-8 python3 packaging/linux/check_appimage_glibc.py squashfs-root 17
              rm -rf squashfs-root
              mkdir -p dist && mv ./*.AppImage dist/ 2>/dev/null || true
              ls -lh dist/
            '

      - uses: actions/upload-artifact@v4
        with:
          name: appimage-qt5
          path: dist/*.AppImage
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────
  #  3. Linux AppImage（Qt 6）—— glibc 2.28
  #
  #     ★ 为什么是 rockylinux:8，而不是 debian:10 ★
  #       Qt 6.8.1 的 Linux 二进制归档名是
  #         qtbase-Linux-RHEL_8_10-GCC-Linux-RHEL_8_10-X86_64.7z
  #       即**在 RHEL 8.10 上用 GCC 11 编的**。要在 RHEL 8 系上编我们的程序，
  #       需要 GCC 11（AppStream 里的 gcc-toolset-11），因为：
  #         · Qt 6.8 官方要求 GCC >= 11（C++17 特性用得比较满）
  #         · Rocky 8 默认 GCC 只有 8.5
  #       ⇒ 装 gcc-toolset-11，用 `source /opt/rh/gcc-toolset-11/enable` 激活。
  #       glibc 侧：Rocky 8 = 2.28，正好与 Qt 6.8.1 二进制基线吻合。
  #
  #     ★ 为什么不用 debian:10 ★
  #       Debian 10 是 GCC 8.3 + glibc 2.28，glibc 对得上，但 GCC 版本不够，
  #       编不过 Qt 6.8 的头文件；而且它的 python3.7 装不了新版 aqtinstall
  #       （inflate64 需要更高 Python）。两处都走不通。
  # ────────────────────────────────────────────────────────────────────────
  appimage-qt6:
    name: Linux AppImage (Qt 6.8, glibc 2.28+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 在宿主上下载 Qt 6.8（避开容器里的老 Python）
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          # ★ 必须是 linux_gcc_64，不能写 gcc_64 ★
          #   Qt >= 6.7 的 Linux 仓库包名已改成 qt.qt6.681.linux_gcc_64，
          #   传 gcc_64 会让 aqt 去找不存在的包，报
          #     "The packages ['qt_base'] were not found while parsing XML"
          #   （Qt 5.15.2 的仓库仍是 gcc_64，所以那个 job 不受影响）
          arch: 'linux_gcc_64'
          cache: true

      - name: 在 rockylinux:8 容器里编译 + 打包
        run: |
          docker run --rm \
            -v "$PWD":/work -w /work \
            -v "$QT_ROOT_DIR":/opt/Qt:ro \
            -e APP_VERSION="${{ env.APP_VERSION }}" \
            rockylinux:8 \
            bash -c '
              set -euo pipefail

              # ★ 必须先开 PowerTools ★
              #   xcb-util-*/libxkbcommon-x11-devel/ninja-build 这些**不在 BaseOS/AppStream**，
              #   而在 PowerTools（el8 的名字；el9 才叫 CRB）。不开就直接
              #     "No match for argument: xcb-util-devel" → Error: Unable to find a match
              #   这是 CI 上真实撞到的。（EPEL 只是少数包的来源，PowerTools 才是关键）
              dnf install -y dnf-plugins-core
              dnf config-manager --set-enabled powertools

              # ★ EPEL 也要开 ★
              #   xcb-util-cursor 在 Rocky 8 的 BaseOS/AppStream/PowerTools/extras/devel
              #   **全都没有**（实测逐仓库扫过），只在 EPEL 8 里：
              #     epel/8/Everything/x86_64/Packages/x/xcb-util-cursor-0.1.3-9.el8.x86_64.rpm
              #   epel-release 本身在 Rocky 的 extras 仓库里，直接装即可。
              dnf install -y epel-release

              # ★ 刻意不装 ninja ★
              #   本工程只用默认的 Unix Makefiles 生成器，ninja 在 el8 属于 Devel 仓库，
              #   引它只会多一个失败点。cmake 默认就找 make（binutils/make 已随基础镜像）。
              dnf install -y \
                gcc-toolset-11-toolchain cmake make file wget which \
                mesa-libGL-devel libxkbcommon-devel libxkbcommon-x11-devel \
                libX11-devel libXext-devel libXrender-devel libXfixes-devel \
                libXi-devel libxcb-devel xcb-util-devel xcb-util-image-devel \
                xcb-util-keysyms-devel xcb-util-renderutil-devel \
                xcb-util-wm-devel fontconfig-devel freetype-devel \
                xcb-util-cursor-devel xcb-util-cursor \
                cups-libs cups-devel \
                libSM libICE libX11-xcb glib2
              # ↑ ★ 最后一行是"预防性"补齐：都是 xcb 平台插件的运行时依赖 ★
              #   linuxdeploy 的 qt 插件按 soname 逐个收集，缺一个就整步失败，
              #   而且**一次只报一个**（第 7/8 轮就是这么被遛的）。
              #   与其一轮轮挤牙膏，不如把已知的补齐：
              #     libSM / libICE   → 会话管理（AppStream）
              #     libX11-xcb       → Xlib/XCB 接口（AppStream）
              #     glib2            → 事件循环（BaseOS）
              #   这三个仓库位置均已逐个核实过。
              #
              # ↑ ★ cups 也是必须的：Qt6 PrintSupport 链 libcups.so.2 ★
              #   漏了 linuxdeploy 会报（第 8 轮就是这个）：
              #     [qt/stdout] ERROR: Could not find dependency: libcups.so.2
              #     ERROR: Failed to run plugin: qt (exit code: 1)
              #   cups-libs 在 BaseOS、cups-devel 在 AppStream，Rocky 8 都有。
              #
              # ↑ ★ xcb-util-cursor 是 QPA(xcb) 插件的**运行时**依赖 ★
              #   Qt 6.5+ 起 xcb 平台插件会链 libxcb-cursor.so.0。
              #   只装 -devel 不够，linuxdeploy 的 qt 插件要按 soname 收集，
              #   缺了直接报：
              #     [qt/stdout] ERROR: Could not find dependency: libxcb-cursor.so.0
              #     ERROR: Failed to run plugin: qt (exit code: 1)
              #   这两个包来自 EPEL 8（上面已装 epel-release）。

              # 激活 GCC 11（Rocky 8 默认只有 8.5，编不动 Qt 6.8 的头）
              source /opt/rh/gcc-toolset-11/enable
              gcc --version
              cmake --version

              # ★ 不写 -G Ninja → 用默认生成器（Unix Makefiles）
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_PREFIX_PATH=/opt/Qt -DZLPE_REQUIRE_I18N=ON
              cmake --build build

              export APPIMAGE_EXTRACT_AND_RUN=1
              export QTDIR=/opt/Qt
              export PATH="$QTDIR/bin:$PATH"
              export VERSION="$APP_VERSION"
              export OUTPUT="ZlPhotoEdit-${APP_VERSION}-glibc228-x86_64.AppImage"

              wget -q -O linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
              wget -q -O linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
              chmod +x linuxdeploy linuxdeploy-plugin-qt

              mkdir -p AppDir/usr/bin AppDir/usr/share/applications \
                       AppDir/usr/share/icons/hicolor/256x256/apps
              cp build/ZlPhotoEdit                           AppDir/usr/bin/
              cp packaging/linux/zlphotoedit.desktop         AppDir/usr/share/applications/
              cp packaging/linux/zlphotoedit.png             AppDir/usr/share/icons/hicolor/256x256/apps/

              ./linuxdeploy --appdir AppDir --plugin qt --output appimage

              # ★ libstdc++ 要在 linuxdeploy 之后再补 ★
              #   gcc-toolset-11 的 libstdc++ 比 Rocky 8 自带的（8.5）新，
              #   目标机器上未必有 → 显式塞进 AppDir，保证 AppImage 自洽。
              #   · 必须放在 linuxdeploy 之后：AppDir/usr/lib 到那时才存在；
              #   · 用 -L 解引用符号链接，拿到真实 .so.6.
              TLS_LIBSTDCPP=$(gcc -print-file-name=libstdc++.so.6)
              if [ -f "$TLS_LIBSTDCPP" ]; then
                mkdir -p AppDir/usr/lib
                cp -Lv "$TLS_LIBSTDCPP" AppDir/usr/lib/
              fi

              mkdir -p dist && mv ./*.AppImage dist/ 2>/dev/null || true
              ls -lh dist/
            '

      - uses: actions/upload-artifact@v4
        with:
          name: appimage-qt6
          path: dist/*.AppImage
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────
  #  4 + 5. Linux deb / rpm —— 依赖系统 Qt6，包里只有自己的东西
  # ────────────────────────────────────────────────────────────────────────
  linux-packages:
    name: Linux ${{ matrix.fmt }} (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: 'ubuntu:24.04', fmt: 'deb' }   # 系统 Qt 6.4.2
          - { distro: 'fedora:43',    fmt: 'rpm' }   # 系统 Qt 6.10.3
    container: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统 Qt6 + 打包工具（Deb 系）
        if: matrix.fmt == 'deb'
        run: |
          apt-get update
          # ★ qt6-l10n-tools 提供 lrelease（/usr/lib/qt6/bin，不在 PATH）★
          #   漏装它 = 没有 .qm = 打包出来的程序界面永远回落到英文源码，
          #   而构建全绿。见 CMakeLists.txt 的 ZLPE_REQUIRE_I18N。
          apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-svg-dev qt6-l10n-tools libgl1-mesa-dev \
            cmake ninja-build g++ dpkg-dev fakeroot

      - name: 安装系统 Qt6 + 打包工具（RPM 系）
        if: matrix.fmt == 'rpm'
        run: |
          # ★ qt6-linguist 提供 lrelease（/usr/lib64/qt6/bin，不在 PATH）★
          dnf install -y qt6-qtbase-devel qt6-qtsvg-devel qt6-linguist \
            mesa-libGL-devel cmake ninja-build gcc-c++ rpm-build

      - name: 配置 + 构建（★ 链系统 Qt，不给 CMAKE_PREFIX_PATH）
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DZLPE_REQUIRE_I18N=ON
          cmake --build build

      - name: 核对翻译已内嵌（★ 挡住"能跑但永远英文"的静默事故）
        # ★ 必须用 "|" 字面块，不能用普通标量 + 反斜杠续行 ★
        #   普通标量里 YAML 把换行折叠成空格，反斜杠成了字面字符，
        #   于是 shell 看到 "build/ZlPhotoEdit \ zh_CN ..."，
        #   "\ " 转义掉空格 → 第一个语言变成 " zh_CN"（带前导空格），
        #   脚本去找 "zlphotoedit_ zh_CN.qm" 当然找不到 —— run #23 就栽在这。
        run: |
          python3 packaging/i18n/check_embedded_i18n.py build/ZlPhotoEdit \
            zh_CN zh_TW fr es ja ru

      - name: 打 deb
        if: matrix.fmt == 'deb'
        run: bash packaging/linux/make-deb.sh "${{ env.APP_VERSION }}" build/ZlPhotoEdit dist

      - name: 打 rpm
        if: matrix.fmt == 'rpm'
        run: bash packaging/linux/make-rpm.sh "${{ env.APP_VERSION }}" build/ZlPhotoEdit dist

      - name: 核对产物（★ 产物是 .deb/.rpm 不在时立刻报错，别等到 upload 才发现）
        run: |
          pwd
          ls -lh dist/ || true
          test -n "$(ls -A dist/ 2>/dev/null)" || { echo "dist/ 是空的，打包脚本没把产物留在仓库目录里"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.fmt }}
          path: |
            dist/*.deb
            dist/**/*.rpm
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────
  #  6. macOS x86_64 —— Qt 5.15.2（最低 macOS 10.13）
  # ────────────────────────────────────────────────────────────────────────
  macos-x86_64:
    name: macOS x86_64 (Qt 5.15.2, 10.13+)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Qt 5.15.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'clang_64'
          cache: true

      - name: 生成 .icns 图标
        run: bash packaging/macos/make-icns.sh

      - name: 配置 + 构建
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES=x86_64 \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
                -DZLPE_REQUIRE_I18N=ON
          cmake --build build

      - name: macdeployqt
        run: |
          macdeployqt build/ZlPhotoEdit.app -verbose=1
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/ZlPhotoEdit.app \
            "dist/ZlPhotoEdit-${{ env.APP_VERSION }}-macos-x86_64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: dist/*.zip
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────
  #  7. macOS arm64 —— Qt 6.8（最低 macOS 11.0）
  # ────────────────────────────────────────────────────────────────────────
  macos-arm64:
    name: macOS arm64 (Qt 6.8, 11.0+)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          arch: 'clang_64'
          cache: true

      - name: 生成 .icns 图标
        run: bash packaging/macos/make-icns.sh

      - name: 配置 + 构建
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES=arm64 \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
                -DZLPE_REQUIRE_I18N=ON
          cmake --build build

      - name: macdeployqt
        run: |
          macdeployqt build/ZlPhotoEdit.app -verbose=1
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/ZlPhotoEdit.app \
            "dist/ZlPhotoEdit-${{ env.APP_VERSION }}-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.zip
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────
  #  汇总：把七个产物挂到一个 GitHub Release（仅 tag 触发时）
  # ────────────────────────────────────────────────────────────────────────
  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, appimage-qt5, appimage-qt6, linux-packages, macos-x86_64, macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 汇总产物
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} dist/ \;
          ls -lh dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true